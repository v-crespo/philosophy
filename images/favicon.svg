<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>V.</title>
  <rect width="64" height="64" rx="14" fill="#1d3557"/>
  <g fill="#f8f5ee">
    <!-- serif V: thick left stroke, thin right stroke meeting at a point -->
    <polygon points="12,15 22,15 32.29,35.59 42,15 46,15 29.5,50"/>
    <!-- top serifs -->
    <rect x="8" y="15" width="18" height="2.6"/>
    <rect x="39.5" y="15" width="10" height="2.4"/>
  </g>
  <!-- the full stop -->
  <circle cx="52" cy="46.5" r="4.6" fill="#e0a83e"/>
</svg>
